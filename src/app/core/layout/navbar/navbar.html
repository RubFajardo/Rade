<nav class="bg-[#1a1a1a] text-white py-4 fixed z-50  w-screen ">
  <div class="px-12 mx-auto flex items-center justify-between w-full ">
    <div class="flex items-center">
      <a routerLink="/">
        <div class="w-8 h-8 bg-[#FFD22A] rounded-lg flex items-center justify-center">
          <span class="text-black font-bold text-xl">◆</span>
        </div>
      </a>

    </div>

    @if (user()) {
      <div class="flex items-center gap-8 text-sm">
        <div class="relative">
          <!-- Avatar Button -->
          <button
            (click)="toggleDropdown()"
            class="flex items-center gap-2 focus:outline-none">
            <div
              class="w-10 h-10 rounded-full overflow-hidden border-2 border-[#FFD22A] hover:border-[#ffc700] transition-colors">
              @if (user()?.profile?.avatar) {
                <img
                  [src]="user()?.profile?.avatar
            ? 'http://localhost:8080/api/users/avatar/' + user()?.profile?.avatar
            : 'https://i.pinimg.com/474x/7f/9e/f5/7f9ef552cb071c696e932222260af318.jpg'"
                  [alt]="user()?.name || 'Avatar'"
                  class="w-full h-full object-cover">
              } @else {
                <!-- Avatar por defecto si no hay imagen -->
                <div
                  class="w-full h-full bg-gradient-to-br from-[#FFD22A] to-[#ffc700] flex items-center justify-center text-black font-bold text-lg">
                  {{ (user()?.name?.[0] || 'U').toUpperCase() }}

                </div>
              }
            </div>
          </button>

          <!-- Dropdown Menu -->
          @if (isDropdownOpen()) {
            <div
              class="absolute right-0 mt-2 w-48 bg-[#1a1a1a] border border-[#FFD22A]/20 rounded-lg shadow-lg overflow-hidden z-50">
              <!-- User Info -->
              <div class="px-4 py-3 border-b border-[#FFD22A]/20">
                <p class="text-sm font-medium text-white">{{ user()?.name }}</p>
                <p class="text-xs text-gray-400">{{ user()?.email }}</p>
              </div>

              <!-- Menu Items -->
              <div class="py-1">
                <a
                  routerLink="/profile"
                  (click)="closeDropdown()"
                  class="block px-4 py-2 text-sm text-white hover:bg-[#FFD22A]/10 transition-colors">
                  Ver Perfil
                </a>
                <button
                  (click)="logout()"
                  class="w-full text-left px-4 py-2 text-sm text-white hover:bg-[#FFD22A]/10 transition-colors">
                  Cerrar Sesión
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    } @else {
      <div class="flex items-center gap-8 text-sm">
        <a
          routerLink="/login"
          class="bg-[#FFD22A] text-black px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2
        hover:bg-[#ffc700] transition-colors">
          <span>Iniciar Sesión</span>
        </a>
      </div>
    }

  </div>
</nav>
