<div class="relative w-screen h-screen flex overflow-hidden ">

  <!-- Panel Izquierdo - Visual -->
  <div class="hidden md:w-1/2 md:flex  bg-gradient-to-t from-[#FFD22A]  to-[#FF3B1F]  relative overflow-hidden">

    <img
      src="assets/gymgirl.png"
      alt="Photography"
      class="absolute bottom-0 -right-40 w-4xl h-auto object-contain  "
    />
    <!-- Content -->
    <div class="relative z-10 flex flex-col justify-end p-12 text-white">

      <!-- Main Text -->
      <div>
        <h1 class="text-5xl font-bold leading-tight mb-4 text-[2rem] md:text-[3rem] lg:text-[4rem] ">
          Capturing Moments,<br/>
          Creating Memories
        </h1>
        <button
          routerLink="/"
          class="self-start flex items-center gap-2 font-medium hover:underline"
        >
          <span>← Back to website</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Panel Derecho - Formulario -->
  <div class="w-full md:w-1/2 flex flex-col justify-center p-8 md:p-12">
    <!-- Mobile Back Button -->


    <div class="w-full max-w-md mx-auto">
      <h2 class="text-3xl font-bold text-white mb-2">
        {{ isLoginMode ? 'Welcome back' : 'Create an account' }}
      </h2>
      <p class="text-gray-400 mb-8">
        @if (isLoginMode) {
          <span>Don't have an account? <button (click)="toggleMode()"
                                               class="text-[#FFD22A] hover:underline">Sign up</button></span>
        } @else {
          <span>Already have an account? <button (click)="toggleMode()"
                                                 class="text-[#FFD22A] hover:underline">Log in</button></span>
        }
      </p>

      <form #form="ngForm" (ngSubmit)="onSubmit(form)" class="space-y-4">
        @if (!isLoginMode) {
          <div class="grid grid-cols-2 gap-4">
            <div>
              <input
                type="text"
                name="firstName"
                ngModel
                required
                placeholder="First name"
                class="w-full px-4 py-3 bg-[#3a3a3a] text-white rounded-lg border border-[#4a4a4a] focus:outline-none focus:border-[#FFD22A] focus:ring-1 focus:ring-[#FFD22A] placeholder-gray-500"
              />
            </div>
            <div>
              <input
                type="text"
                name="lastName"
                ngModel
                required
                placeholder="Last name"
                class="w-full px-4 py-3 bg-[#3a3a3a] text-white rounded-lg border border-[#4a4a4a] focus:outline-none focus:border-[#FFD22A] focus:ring-1 focus:ring-[#FFD22A] placeholder-gray-500"
              />
            </div>
          </div>
        }

        <div>
          <input
            type="email"
            name="email"
            ngModel
            required
            placeholder="Email"
            class="w-full px-4 py-3 bg-[#3a3a3a] text-white rounded-lg border border-[#4a4a4a] focus:outline-none focus:border-[#FFD22A] focus:ring-1 focus:ring-[#FFD22A] placeholder-gray-500"
          />
        </div>

        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            ngModel
            required
            placeholder="Enter your password"
            class="w-full px-4 py-3 bg-[#3a3a3a] text-white rounded-lg border border-[#4a4a4a] focus:outline-none focus:border-[#FFD22A] focus:ring-1 focus:ring-[#FFD22A] placeholder-gray-500"
          />
          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              @if (showPassword) {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              } @else {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              }
            </svg>
          </button>
        </div>

        @if (!isLoginMode) {
          <div class="flex items-center gap-2">
            <input
              type="checkbox"
              name="terms"
              ngModel
              required
              class="w-4 h-4 rounded border-[#4a4a4a] bg-[#3a3a3a] text-[#FFD22A] focus:ring-[#FFD22A] focus:ring-offset-0"
            />
            <label class="text-sm text-gray-400">
              I agree to the <a href="#" class="text-[#FFD22A] hover:underline">Terms & Conditions</a>
            </label>
          </div>
        }

        <button
          type="submit"
          class="w-full bg-[#FFD22A] text-black font-semibold py-3 rounded-lg  transition-all duration-200 transform hover:scale-[1.02]"
        >
          {{ isLoginMode ? 'Log in' : 'Create account' }}
        </button>
      </form>

      <!-- Social Login -->
      <div class="mt-6">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-[#4a4a4a]"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-[#2a2a2a] text-gray-400">Or register with</span>
          </div>
        </div>

        <button
          class="flex items-center justify-center gap-2 px-4 py-3 mt-4 w-full bg-[#3a3a3a] text-white rounded-lg border border-[#4a4a4a] hover:border-[#FFD22A] transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="currentColor"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="currentColor"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="currentColor"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="currentColor"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span class="text-sm">Google</span>
        </button>

      </div>
    </div>
  </div>
</div>
